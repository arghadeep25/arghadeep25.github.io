<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pixworm | Arghadeep Mazumder</title>
    <meta
      name="description"
      content="Pixworm: travel, nature and wildlife photographs by Arghadeep Mazumder."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="apple-touch-icon" href="/logo-180.png" />
    <script type="module" src="/src/pages/pixworm.js"></script>
  </head>
  <body data-section="pixworm" id="top">
    <div data-shell="nav"></div>

    <section class="hall" id="opening" aria-label="Pixworm photographs">
      <div class="hall__pin">
        <div class="hall__world"></div>
        <div class="hall__hud">
          <span data-group>Pixworm</span>
          <span class="hall__line"><i></i></span>
          <a href="#collections">Skip to collections</a>
        </div>
      </div>
    </section>

    <main>
      <section class="pxc" id="collections" aria-labelledby="pxc-title">
        <div class="pxc__pin">
          <div class="wrap pxc__head">
            <h2 id="pxc-title">Collections</h2>
            <p>Places and subjects, one set each.</p>
          </div>
          <div class="pxc__track"></div>
        </div>
      </section>

      <section class="pxs wrap" id="selected" aria-labelledby="pxs-title">
        <div class="pxs__head">
          <h2 id="pxs-title">Selected</h2>
          <p>A few frames I keep coming back to.</p>
        </div>
        <div class="mosaic"></div>
      </section>
    </main>

    <div data-shell="footer"></div>
  </body>
</html>
